services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      POSTGRES_DB: estoque
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro 
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estoque -d estoque']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
